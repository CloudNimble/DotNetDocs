name: Build and Deploy to NuGet

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '.github/**'
      - 'src/CloudNimble.DotNetDocs.Docs/**'
      - 'src/CloudNimble.DotNetDocs.Reference.Mintlify/**'
      - 'specs/**'
  workflow_dispatch:
    inputs:
      deploy_to_nuget:
        description: 'Deploy to NuGet'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  actions: write

env:
   DOTNET_VERSION: '11.0.x'
   SOLUTION_FILE: 'src/CloudNimble.DotNetDocs.slnx'
  
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      mintlify_version: ${{ steps.version.outputs.MINTLIFY_VERSION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Install .NET versions
      shell: pwsh
      run: |
         Write-Host "📥 Installing .NET versions..."
         # Install .NET 8, 9, 10, 11
         $versions = @("8.0", "9.0", "10.0", "11.0")
         foreach ($version in $versions) {
           Write-Host "Installing .NET $version..."
           Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
           if ($version -eq "11.0") {
             ./dotnet-install.ps1 -Channel $version -Quality preview -InstallDir "$env:ProgramFiles\dotnet"
           } else {
             ./dotnet-install.ps1 -Channel $version -InstallDir "$env:ProgramFiles\dotnet"
           }
         }
         
         # Add to PATH for this job
         echo "$env:ProgramFiles\dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
         
         # Verify installation
         dotnet --list-sdks

    - name: Get version variables
      id: version
      shell: pwsh
      run: |
        function Get-Var([string]$value, [string]$fallback) {
          if ([string]::IsNullOrEmpty($value)) { return $fallback }
          return $value
        }

        function Compose-Version([string]$major, [string]$minor, [string]$patch, [string]$previewSuffix, [string]$ref) {
          if ($ref -eq "refs/heads/main") {
            return @{
              Version = "$major.$minor.$patch"
              NextPatch = ([int]$patch + 1).ToString()
              NextPreview = $null
            }
          }
          if ($ref -eq "refs/heads/dev") {
            $next = [int]$previewSuffix + 1
            return @{
              Version = "$major.$minor.$patch-preview.$next"
              NextPatch = $null
              NextPreview = $next.ToString()
            }
          }
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss" -AsUTC
          return @{
            Version = "$major.$minor.$patch-CI-$timestamp"
            NextPatch = $null
            NextPreview = $null
          }
        }

        $ref = "${{ github.ref }}"

        $majorVersion = Get-Var "${{ vars.VERSION_MAJOR }}" "1"
        $minorVersion = Get-Var "${{ vars.VERSION_MINOR }}" "5"
        $patchVersion = Get-Var "${{ vars.VERSION_PATCH }}" "0"
        $previewSuffix = Get-Var "${{ vars.VERSION_PREVIEW_SUFFIX }}" "0"

        $mintlifyMajor = Get-Var "${{ vars.MINTLIFY_VERSION_MAJOR }}" "2"
        $mintlifyMinor = Get-Var "${{ vars.MINTLIFY_VERSION_MINOR }}" "0"
        $mintlifyPatch = Get-Var "${{ vars.MINTLIFY_VERSION_PATCH }}" "0"
        $mintlifyPreview = Get-Var "${{ vars.MINTLIFY_VERSION_PREVIEW_SUFFIX }}" "0"

        Write-Host "🔢 DotNetDocs: MAJOR=$majorVersion, MINOR=$minorVersion, PATCH=$patchVersion, PREVIEW_SUFFIX=$previewSuffix"
        Write-Host "🔢 Mintlify:   MAJOR=$mintlifyMajor, MINOR=$mintlifyMinor, PATCH=$mintlifyPatch, PREVIEW_SUFFIX=$mintlifyPreview"

        $dotnetDocs = Compose-Version $majorVersion $minorVersion $patchVersion $previewSuffix $ref
        $mintlify = Compose-Version $mintlifyMajor $mintlifyMinor $mintlifyPatch $mintlifyPreview $ref

        if ($dotnetDocs.NextPatch) { echo "NEXT_PATCH_VERSION=$($dotnetDocs.NextPatch)" >> $env:GITHUB_OUTPUT }
        if ($dotnetDocs.NextPreview) { echo "NEXT_PREVIEW_SUFFIX=$($dotnetDocs.NextPreview)" >> $env:GITHUB_OUTPUT }
        if ($mintlify.NextPatch) { echo "NEXT_MINTLIFY_PATCH_VERSION=$($mintlify.NextPatch)" >> $env:GITHUB_OUTPUT }
        if ($mintlify.NextPreview) { echo "NEXT_MINTLIFY_PREVIEW_SUFFIX=$($mintlify.NextPreview)" >> $env:GITHUB_OUTPUT }

        echo "VERSION=$($dotnetDocs.Version)" >> $env:GITHUB_OUTPUT
        echo "MINTLIFY_VERSION=$($mintlify.Version)" >> $env:GITHUB_OUTPUT
        echo "MAJOR_VERSION=$majorVersion" >> $env:GITHUB_OUTPUT
        echo "MINOR_VERSION=$minorVersion" >> $env:GITHUB_OUTPUT
        echo "PATCH_VERSION=$patchVersion" >> $env:GITHUB_OUTPUT
        echo "BRANCH_TYPE=$(if ($ref -eq 'refs/heads/main') { 'main' } elseif ($ref -eq 'refs/heads/dev') { 'dev' } else { 'feature' })" >> $env:GITHUB_OUTPUT

        Write-Host "📦 DotNetDocs version: $($dotnetDocs.Version)"
        Write-Host "📦 Mintlify version:   $($mintlify.Version)"

    - name: Update .docsproj SDK references
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        Write-Host "🔄 Updating .docsproj files to use DotNetDocs.Sdk/$version"

        # Find all .docsproj files
        $docsprojFiles = Get-ChildItem -Path "${{ github.workspace }}\src" -Filter "*.docsproj" -Recurse

        foreach ($file in $docsprojFiles) {
          Write-Host "  📝 Updating $($file.Name)..."
          $content = Get-Content $file.FullName -Raw
          $updatedContent = $content -replace 'Sdk="DotNetDocs\.Sdk/[^"]*"', "Sdk=`"DotNetDocs.Sdk/$version`""
          Set-Content -Path $file.FullName -Value $updatedContent -NoNewline
        }

        Write-Host "✅ Updated all .docsproj files to reference DotNetDocs.Sdk/$version"

    - name: Setup local NuGet feed
      shell: pwsh
      run: |
        $localFeedPath = "${{ vars.LOCAL_NUGET_FEED }}"
        if ([string]::IsNullOrEmpty($localFeedPath)) {
          $localFeedPath = "${{ github.workspace }}\local-nuget-feed"
        }
        New-Item -Path $localFeedPath -ItemType Directory -Force
        Write-Host "📁 Created local NuGet feed at: $localFeedPath"
        echo "LOCAL_NUGET_FEED=$localFeedPath" >> $env:GITHUB_ENV

    - name: Update NuGet.config for CI
      shell: pwsh
      run: |
        $localFeed = "${{ env.LOCAL_NUGET_FEED }}"
        $configPath = "${{ github.workspace }}\NuGet.config"
        "<?xml version=`"1.0`" encoding=`"utf-8`"?>" | Out-File -FilePath $configPath -Encoding utf8
        "<configuration>" | Add-Content -Path $configPath -Encoding utf8
        "  <packageSources>" | Add-Content -Path $configPath -Encoding utf8
        "    <clear />" | Add-Content -Path $configPath -Encoding utf8
        "    <add key=`"nuget.org`" value=`"https://api.nuget.org/v3/index.json`" protocolVersion=`"3`" />" | Add-Content -Path $configPath -Encoding utf8
        "    <add key=`"local-feed`" value=`"$localFeed`" />" | Add-Content -Path $configPath -Encoding utf8
        "  </packageSources>" | Add-Content -Path $configPath -Encoding utf8
        "  <packageSourceMapping>" | Add-Content -Path $configPath -Encoding utf8
        "    <!-- Map DotNetDocs SDK packages to local feed during development -->" | Add-Content -Path $configPath -Encoding utf8
        "    <packageSource key=`"local-feed`">" | Add-Content -Path $configPath -Encoding utf8
        "      <package pattern=`"DotNetDocs.*`" />" | Add-Content -Path $configPath -Encoding utf8
        "    </packageSource>" | Add-Content -Path $configPath -Encoding utf8
        "    <!-- All other packages from nuget.org -->" | Add-Content -Path $configPath -Encoding utf8
        "    <packageSource key=`"nuget.org`">" | Add-Content -Path $configPath -Encoding utf8
        "      <package pattern=`"*`" />" | Add-Content -Path $configPath -Encoding utf8
        "    </packageSource>" | Add-Content -Path $configPath -Encoding utf8
        "  </packageSourceMapping>" | Add-Content -Path $configPath -Encoding utf8
        "</configuration>" | Add-Content -Path $configPath -Encoding utf8
        Write-Host "✅ Updated NuGet.config for CI build"

    - name: Build SDK project first
      shell: pwsh
      run: |
        Write-Host "🔨 Building DotNetDocs.Sdk with version ${{ steps.version.outputs.VERSION }}"
        Write-Host "📦 First, build the SDK Tasks project..."
        dotnet build src/CloudNimble.DotNetDocs.Sdk.Tasks/CloudNimble.DotNetDocs.Sdk.Tasks.csproj --configuration Release /p:DotNetDocsPackageVersion=${{ steps.version.outputs.VERSION }} /p:MintlifyPackageVersion=${{ steps.version.outputs.MINTLIFY_VERSION }}
        Write-Host "✅ SDK Tasks built successfully"
        Write-Host "🔧 Now packing the SDK project..."
        dotnet pack src/CloudNimble.DotNetDocs.Sdk/CloudNimble.DotNetDocs.Sdk.csproj --configuration Release --output "${{ env.LOCAL_NUGET_FEED }}" /p:DotNetDocsPackageVersion=${{ steps.version.outputs.VERSION }} /p:MintlifyPackageVersion=${{ steps.version.outputs.MINTLIFY_VERSION }}
        Write-Host "📦 SDK package created and pushed to local feed"

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore /p:DotNetDocsPackageVersion=${{ steps.version.outputs.VERSION }} /p:MintlifyPackageVersion=${{ steps.version.outputs.MINTLIFY_VERSION }}

    - name: Test
      working-directory: src
      run: dotnet test --configuration Release --no-build

    - name: Pack
      run: dotnet pack ${{ env.SOLUTION_FILE }} --configuration Release --no-build --output ./artifacts /p:DotNetDocsPackageVersion=${{ steps.version.outputs.VERSION }} /p:MintlifyPackageVersion=${{ steps.version.outputs.MINTLIFY_VERSION }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
        retention-days: 7

  deploy:
    needs: build
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_nuget == 'true')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Get version data from build
      id: version
      shell: pwsh
      run: |
        # Re-calculate version data for this job (since we can't pass complex data between jobs)
        $majorVersion = "${{ vars.VERSION_MAJOR }}"
        if ([string]::IsNullOrEmpty($majorVersion)) { $majorVersion = "1" }

        $minorVersion = "${{ vars.VERSION_MINOR }}"
        if ([string]::IsNullOrEmpty($minorVersion)) { $minorVersion = "0" }

        $patchVersion = "${{ vars.VERSION_PATCH }}"
        if ([string]::IsNullOrEmpty($patchVersion)) { $patchVersion = "0" }

        $previewSuffix = "${{ vars.VERSION_PREVIEW_SUFFIX }}"
        if ([string]::IsNullOrEmpty($previewSuffix)) { $previewSuffix = "0" }

        $mintlifyPatch = "${{ vars.MINTLIFY_VERSION_PATCH }}"
        if ([string]::IsNullOrEmpty($mintlifyPatch)) { $mintlifyPatch = "0" }

        $mintlifyPreview = "${{ vars.MINTLIFY_VERSION_PREVIEW_SUFFIX }}"
        if ([string]::IsNullOrEmpty($mintlifyPreview)) { $mintlifyPreview = "0" }

        $ref = "${{ github.ref }}"
        if ($ref -eq "refs/heads/main") {
          $nextPatchVersion = [int]$patchVersion + 1
          $nextMintlifyPatch = [int]$mintlifyPatch + 1
          echo "NEXT_PATCH_VERSION=$nextPatchVersion" >> $env:GITHUB_OUTPUT
          echo "NEXT_MINTLIFY_PATCH_VERSION=$nextMintlifyPatch" >> $env:GITHUB_OUTPUT
          echo "BRANCH_TYPE=main" >> $env:GITHUB_OUTPUT
        }
        elseif ($ref -eq "refs/heads/dev") {
          $nextPreviewSuffix = [int]$previewSuffix + 1
          $nextMintlifyPreview = [int]$mintlifyPreview + 1
          echo "NEXT_PREVIEW_SUFFIX=$nextPreviewSuffix" >> $env:GITHUB_OUTPUT
          echo "NEXT_MINTLIFY_PREVIEW_SUFFIX=$nextMintlifyPreview" >> $env:GITHUB_OUTPUT
          echo "BRANCH_TYPE=dev" >> $env:GITHUB_OUTPUT
        }
        else {
          echo "BRANCH_TYPE=other" >> $env:GITHUB_OUTPUT
        }

    - name: Install .NET versions
      shell: pwsh
      run: |
         Write-Host "📥 Installing .NET versions..."
         # Install .NET 8, 9, 10, 11
         $versions = @("8.0", "9.0", "10.0", "11.0")
         foreach ($version in $versions) {
           Write-Host "Installing .NET $version..."
           Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
           if ($version -eq "11.0") {
             ./dotnet-install.ps1 -Channel $version -Quality preview -InstallDir "$env:ProgramFiles\dotnet"
           } else {
             ./dotnet-install.ps1 -Channel $version -InstallDir "$env:ProgramFiles\dotnet"
           }
         }
         
         # Add to PATH for this job
         echo "$env:ProgramFiles\dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USER != '' && vars.NUGET_USER || 'CloudNimble' }}

    - name: Push to NuGet
      id: nuget_push
      shell: pwsh
      run: |
        $deploymentSuccess = $true
        $errorMessage = ""
        
        Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
          Write-Host "📤 Pushing $($_.Name) to NuGet..."
          try {
            $result = dotnet nuget push $_.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate 2>&1
            
            Write-Host "✅ Push result: $result"
            
            # Check for specific error patterns
            if ($result -match "error.*unauthorized|invalid.*api.*key|403") {
              $deploymentSuccess = $false
              $errorMessage = "Authentication failed - Trusted Publishing OIDC login was rejected"
              Write-Host "❌ $errorMessage"
            }
            elseif ($result -match "error.*conflict|409|already exists") {
              Write-Host "⚠️ Package version already exists, continuing..."
            }
            elseif ($result -match "error") {
              $deploymentSuccess = $false
              $errorMessage = "Deployment failed: $result"
              Write-Host "❌ $errorMessage"
            }
          }
          catch {
            $deploymentSuccess = $false
            $errorMessage = "Exception during push: $($_.Exception.Message)"
            Write-Host "❌ $errorMessage"
          }
        }
        
        echo "DEPLOYMENT_SUCCESS=$deploymentSuccess" >> $env:GITHUB_OUTPUT
        echo "ERROR_MESSAGE=$errorMessage" >> $env:GITHUB_OUTPUT
        
        if (-not $deploymentSuccess) {
          Write-Host "💥 Deployment failed: $errorMessage"
          exit 1
        }

    - name: Update preview suffix (dev branch only)
      if: steps.version.outputs.BRANCH_TYPE == 'dev' && steps.nuget_push.outputs.DEPLOYMENT_SUCCESS == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
      run: |
        $nextSuffix = "${{ steps.version.outputs.NEXT_PREVIEW_SUFFIX }}"
        Write-Host "🔄 Updating VERSION_PREVIEW_SUFFIX to $nextSuffix"

        $nextMintlifySuffix = "${{ steps.version.outputs.NEXT_MINTLIFY_PREVIEW_SUFFIX }}"
        try {
          gh variable set VERSION_PREVIEW_SUFFIX --body "$nextSuffix"
          Write-Host "✅ Successfully updated VERSION_PREVIEW_SUFFIX to $nextSuffix"

          gh variable set MINTLIFY_VERSION_PREVIEW_SUFFIX --body "$nextMintlifySuffix"
          Write-Host "✅ Successfully updated MINTLIFY_VERSION_PREVIEW_SUFFIX to $nextMintlifySuffix"
        }
        catch {
          Write-Host "⚠️ Failed to update preview suffix variables: $($_.Exception.Message)"
          # Don't fail the build for this
        }

    - name: Update patch version (main branch only)
      if: steps.version.outputs.BRANCH_TYPE == 'main' && steps.nuget_push.outputs.DEPLOYMENT_SUCCESS == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
      run: |
        $nextPatch = "${{ steps.version.outputs.NEXT_PATCH_VERSION }}"
        $nextMintlifyPatch = "${{ steps.version.outputs.NEXT_MINTLIFY_PATCH_VERSION }}"
        Write-Host "🔄 Updating VERSION_PATCH to $nextPatch and MINTLIFY_VERSION_PATCH to $nextMintlifyPatch"

        try {
          gh variable set VERSION_PATCH --body "$nextPatch"
          Write-Host "✅ Successfully updated VERSION_PATCH to $nextPatch"

          gh variable set VERSION_PREVIEW_SUFFIX --body "0"
          Write-Host "✅ Successfully reset VERSION_PREVIEW_SUFFIX to 0"

          gh variable set MINTLIFY_VERSION_PATCH --body "$nextMintlifyPatch"
          Write-Host "✅ Successfully updated MINTLIFY_VERSION_PATCH to $nextMintlifyPatch"

          gh variable set MINTLIFY_VERSION_PREVIEW_SUFFIX --body "0"
          Write-Host "✅ Successfully reset MINTLIFY_VERSION_PREVIEW_SUFFIX to 0"
        }
        catch {
          Write-Host "⚠️ Failed to update version variables: $($_.Exception.Message)"
          # Don't fail the build for this
        }

  create-release:
    needs: [build, deploy]
    runs-on: windows-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.deploy_to_nuget == 'true')

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Prepare Release Notes
      shell: pwsh
      run: |
         $version = "${{ needs.build.outputs.version }}"
         $mintlifyVersion = "${{ needs.build.outputs.mintlify_version }}"
         Write-Host "Creating release for DotNetDocs $version / Mintlify $mintlifyVersion"

         $packageList = ""
         Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
           $base = $_.Name -replace '\.nupkg$', ''
           if ($base -notmatch '^(.*?)\.(\d+.*)$') {
             Write-Host "⚠️ Skipping unrecognized package name: $($_.Name)"
             return
           }
           $packageName = $Matches[1]
           $packageVersion = $Matches[2]
           $packageList += "- [$packageName $packageVersion](https://www.nuget.org/packages/$packageName/$packageVersion)`n"
         }

         $lines = @(
           "## NuGet Packages",
           $packageList,
           "",
           "## Installation",
           '```xml',
           "<Project Sdk=""DotNetDocs.Sdk/$version"">",
           "  <!-- That's it! -->",
           "</Project>",
           '```',
           "",
           "Mintlify.Core $mintlifyVersion is included in this release and versions independently of DotNetDocs."
         )
         $body = $lines -join "`n"
         Set-Content -Path "./release-notes.md" -Value $body -Encoding utf8

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
         tag_name: v${{ needs.build.outputs.version }}
         name: Release v${{ needs.build.outputs.version }}
         body_path: ./release-notes.md
         generate_release_notes: true
         draft: false
         prerelease: false